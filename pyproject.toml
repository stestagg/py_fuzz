[project]
name = "pyfuzz"
version = "0.1.0"
description = "Unified tooling for building, running, and analyzing py-fuzz projects"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11,<4",
  "click",
  "jinja2",
  "json-repair",
  "odhash",
  "openai",
  "pydantic"
]

[tool.setuptools.package-data]
pfui = ["static/*", "static/assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
