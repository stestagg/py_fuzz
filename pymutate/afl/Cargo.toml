[package]
name = "pymutate-afl"
version = "0.1.0"
edition = "2021"
publish = false
description = "AFL++ custom_mutator FFI shim around pymutate-core"

[lib]
name = "pymutate_afl"
# cdylib -> the .so/.dylib that AFL++ loads via AFL_CUSTOM_MUTATOR_LIBRARY.
crate-type = ["cdylib"]

[dependencies]
pymutate-core = { path = "../core" }
# High-level Rust wrapper over the AFL++ custom mutator C ABI. Pinned to the same
# stable revision we develop against; swap to a vendored/path dep at integration.
custom_mutator = { git = "https://github.com/AFLplusplus/AFLplusplus", branch = "stable" }
